server {
    listen 80;


    location / {
        proxy_pass http://frontend;
    }

   location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend:5000;
}

}

    server_name _;

    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:5000/health;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}

